min_maki_version = "0.7.0"
providers = ["antigravity"]

# net reaches the proxy, the Google token endpoint, and Cloud Code Assist for
# the project and the model list. run reads the agy sign-in from the keyring
# and starts the proxy.
[permissions]
net = true
run = true
net_hosts = ["127.0.0.1", "oauth2.googleapis.com", "daily-cloudcode-pa.googleapis.com"]
